          type: string
        provider:
          type: string
          enum:
            - realdebrid
            - alldebrid
            - premiumize
        name:
          type: string
        season:
          type: integer
        episode:
          type: integer
    PatchDebridBody:
      type: object
      properties:
        enabled:
          type: boolean
        apiKey:
          type: string
        provider:
          type: string
          enum:
            - realdebrid
            - alldebrid
            - premiumize
        autoDownloadUncached:
          type: boolean
        rateLimitPerMin:
          type: integer
          minimum: 10
          maximum: 600
    LivenessResponse:
      type: object
      required:
        - status
        - uptimeSec
        - timestamp
        - memory
      properties:
        status:
          type: string
          example: ok
        uptimeSec:
          type: integer
          example: 120
        timestamp:
          type: string
          format: date-time
        memory:
          type: object
          properties:
            heapUsedMb:
              type: integer
            rssMb:
              type: integer
    ErrorResponse:
      type: object
      required:
        - error
      properties:

openapi: 3.1.0
info:
  title: addons-core — Stremio-Addon Aggregator & OMSS API
  version: 1.0.0
  description: Production-grade Stremio-addon aggregator exposing an OMSS-compliant streaming backend, progressive waterfall scraping, dynamic addon management, debrid caching, and health observability.
servers:
  - url: http://localhost:3006
    description: addons-core API Server
tags:
  - name: OMSS Content
    description: Standard OMSS movie, TV, and subtitle aggregation endpoints
  - name: Progressive Scrape
    description: Single-provider waterfall scraping for fast streaming playback
  - name: Addon Management
    description: Addon lifecycle, ordering, configuration, and diagnostics
  - name: Imports
    description: Import addons from URL, Stremio account, or repository
  - name: Debrid & Settings
    description: Debrid configuration, account checks, and background transfers
  - name: Jobs
    description: Durable background job management and task execution
  - name: Health & Metrics
    description: Liveness probes, readiness checks, dependencies, and Prometheus metrics
  - name: Authentication
    description: Session management, login, logout, and CSRF protection
  - name: Cache & Audit
    description: Cache status, purge operations, and operator audit trail
  - name: Proxy & Playback
    description: Secure tokenized playback proxy and range requests
  - name: Native Stremio
    description: Native Stremio protocol compatibility endpoints
paths:
  /v1/movies/{id}:
    get:
      tags:
        - OMSS Content
      summary: Get bulk movie stream sources
      description: Aggregates stream sources from all eligible providers in priority order for a movie by TMDB/IMDb ID.
      parameters:
        - name: id
          in: path
          required: true
          description: TMDB numeric ID or IMDb ID (e.g. 550 or tt0137523)
          schema:
            type: string
      responses:
        '200':
          description: Successful OMSS movie response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OMSSMovieResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tv/{id}/seasons/{season}/episodes/{episode}:
    get:
      tags:
        - OMSS Content
      summary: Get bulk TV episode stream sources
      description: Aggregates stream sources from all eligible providers for a TV series episode.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: season
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - name: episode
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful OMSS TV response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OMSSTVResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/movies/{tmdbId}/providers/{providerId}:
    get:
      tags:
        - Progressive Scrape
      summary: Scrape movie sources from single provider
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: string
        - name: providerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Single provider scrape result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressiveProviderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tv/{tmdbId}/seasons/{season}/episodes/{episode}/providers/{providerId}:
    get:
      tags:
        - Progressive Scrape
      summary: Scrape TV episode sources from single provider
      parameters:
        - name: tmdbId
          in: path
          required: true
          schema:
            type: string
        - name: season
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
        - name: episode
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: providerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Single provider scrape result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressiveProviderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/subtitles:
    get:
      tags:
        - OMSS Content
      summary: Aggregate subtitles across providers
      parameters:
        - name: tmdbId
          in: query
          schema:
            type: string
        - name: imdbId
          in: query
          schema:
            type: string
        - name: season
          in: query
          schema:
            type: integer
            minimum: 0
        - name: episode
          in: query
          schema:
            type: integer
            minimum: 1
        - name: language
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Subtitles collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitlesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/providers:
    get:
      tags:
        - Progressive Scrape
      summary: List available providers with priority and diagnostics
      responses:
        '200':
          description: Ordered list of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProviderSummary'
  /v1/providers/meta:
    get:
      tags:
        - Progressive Scrape
      summary: Get metadata about registered providers
      responses:
        '200':
          description: Provider metadata mapping
          content:
            application/json:
              schema:
                type: object
  /v1/providers/diagnostics:
    get:
      tags:
        - Progressive Scrape
      summary: Get circuit breaker diagnostics across all providers
      responses:
        '200':
          description: Diagnostics summary
          content:
            application/json:
              schema:
                type: object
  /debug/providers/{id}:
    get:
      tags:
        - Health & Metrics
      summary: Protected provider diagnostic trace (Admin only)
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider diagnostic trace
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/addons:
    get:
      tags:
        - Addon Management
      summary: List installed addons with pagination, filters, and sorting
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: search
          in: query
          schema:
            type: string
        - name: capability
          in: query
          schema:
            type: string
            enum:
              - all
              - stream
              - subtitles
              - catalog
              - meta
        - name: health
          in: query
          schema:
            type: string
            enum:
              - all
              - healthy
              - unhealthy
              - unknown
        - name: enabled
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - order
              - name
              - addedAt
              - updatedAt
              - health
        - name: direction
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Paginated list of addons
          headers:
            x-provider-revision:
              schema:
                type: integer
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddonListResponse'
  /v1/addons/{providerId}:
    get:
      tags:
        - Addon Management
      summary: Get single addon details
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
        - name: raw
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Addon details
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Addon Management
      summary: Update addon configuration
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAddonBody'
      responses:
        '200':
          description: Addon updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags:
        - Addon Management
      summary: Uninstall an addon
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Addon deleted
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /v1/addons/{providerId}/refresh:
    post:
      tags:
        - Addon Management
      summary: Re-fetch manifest for an addon
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Manifest refreshed
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /v1/addons/{providerId}/probe:
    post:
      tags:
        - Addon Management
      summary: Probe an addon manifest immediately and record the health result
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Probe result recorded
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/openapi.json:
    get:
      tags:
        - Health & Metrics
      summary: This OpenAPI 3.1 specification (JSON)
      responses:
        '200':
          description: OpenAPI document
  /v1/openapi.yaml:
    get:
      tags:
        - Health & Metrics
      summary: This OpenAPI 3.1 specification (YAML)
      responses:
        '200':
          description: OpenAPI document
  /v1/docs:
    get:
      tags:
        - Health & Metrics
      summary: Interactive API documentation (Swagger UI)
      responses:
        '200':
          description: Swagger UI page
  /v1/quarantine:
    get:
      tags:
        - Addon Management
      summary: List quarantined providers (Phase 7 auto-quarantine after repeated failures)
      responses:
        '200':
          description: Quarantined provider records
  /v1/quarantine/{providerId}:
    post:
      tags:
        - Addon Management
      summary: Manually quarantine a provider (operator) with an optional reason and TTL
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider quarantined
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/quarantine/{providerId}/release:
    post:
      tags:
        - Addon Management
      summary: Manually release a provider from quarantine (admin)
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider released
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/addons/reorder:
    post:
      tags:
        - Addon Management
      summary: Reorder installed addons
      parameters:
        - name: If-Match
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderAddonsBody'
      responses:
        '200':
          description: Addons reordered
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /v1/addons/health/check:
    post:
      tags:
        - Addon Management
      summary: Trigger health check sweep
      parameters:
        - name: async
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Health check completed synchronously
        '202':
          description: Health check queued asynchronously on job engine
  /v1/addons/import/url:
    post:
      tags:
        - Imports
      summary: Import addons from URL or array of URLs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUrlBody'
      responses:
        '200':
          description: Imported synchronously
        '202':
          description: Queued on job engine
  /v1/import:
    post:
      tags:
        - Imports
      summary: Import addons from URL (compatibility alias)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUrlBody'
      responses:
        '200':
          description: Imported synchronously
        '202':
          description: Queued on job engine
  /v1/addons/import/stremio:
    post:
      tags:
        - Imports
      summary: Import addons from Stremio user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportStremioBody'
      responses:
        '200':
          description: Imported synchronously
        '202':
          description: Queued on job engine
  /v1/addons/import/repository:
    post:
      tags:
        - Imports
      summary: Import addons from an addon repository index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRepoBody'
      responses:
        '202':
          description: Repository import task queued
  /v1/import/jobs:
    get:
      tags:
        - Imports
      summary: List import background jobs
      responses:
        '200':
          description: List of jobs
  /v1/import/jobs/{jobId}:
    get:
      tags:
        - Imports
      summary: Get import job status
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job record
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Imports
      summary: Cancel an import job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job cancelled
  /v1/jobs:
    get:
      tags:
        - Jobs
      summary: List durable jobs
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Jobs list
    post:
      tags:
        - Jobs
      summary: Create and enqueue a background job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobBody'
      responses:
        '202':
          description: Job enqueued
  /v1/jobs/{id}:
    get:
      tags:
        - Jobs
      summary: Get job status by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/jobs/{id}/cancel:
    post:
      tags:
        - Jobs
      summary: Cancel a running or queued job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job cancelled
  /v1/jobs/{id}/retry:
    post:
      tags:
        - Jobs
      summary: Re-enqueue a failed or dead-lettered job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job re-enqueued
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/debrid/transfers:
    get:
      tags:
        - Debrid & Settings
      summary: List active and recent debrid transfers
      responses:
        '200':
          description: List of transfers
    post:
      tags:
        - Debrid & Settings
      summary: Submit torrent infoHash for debrid download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DebridTransferBody'
      responses:
        '202':
          description: Transfer queued
  /v1/debrid/transfers/{jobId}:
    get:
      tags:
        - Debrid & Settings
      summary: Get status of debrid transfer job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transfer details
    delete:
      tags:
        - Debrid & Settings
      summary: Cancel a debrid transfer job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transfer cancelled
  /v1/settings:
    get:
      tags:
        - Debrid & Settings
      summary: Get effective service settings (secrets redacted)
      security:
        - BearerAuth: []
        - SessionAuth: []
      responses:
        '200':
          description: Effective settings
  /v1/settings/debrid:
    patch:
      tags:
        - Debrid & Settings
      summary: Update debrid configuration settings
      parameters:
        - name: If-Match
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDebridBody'
      responses:
        '200':
          description: Settings updated
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /v1/settings/debrid/check:
    post:
      tags:
        - Debrid & Settings
      summary: Verify the configured debrid provider credentials (admin)
      responses:
        '200':
          description: Provider check result
  /v1/settings/export:
    get:
      tags:
        - Debrid & Settings
      summary: Export sanitized configuration (no transport URLs, no secrets)
      security:
        - BearerAuth: []
        - SessionAuth: []
      responses:
        '200':
          description: Sanitized export payload
  /v1/settings/import:
    post:
      tags:
        - Debrid & Settings
      summary: Import a previously exported configuration
      security:
        - BearerAuth: []
        - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Settings imported
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/cache/metrics:
    get:
      tags:
        - Cache & Audit
      summary: Get cache hit/miss and cardinality metrics
      responses:
        '200':
          description: Cache statistics
  /v1/audit:
    get:
      tags:
        - Cache & Audit
      summary: Query audit logs for administrative actions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Audit events
  /v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate and receive session cookie or token
      responses:
        '200':
          description: Logged in
  /v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Log out and invalidate current session
      responses:
        '200':
          description: Logged out
  /v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Get the current authenticated actor (401 otherwise)
      responses:
        '200':
          description: Current actor
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/csrf:
    get:
      tags:
        - Authentication
      summary: Return (or mint) the CSRF token for cookie-authenticated sessions
      responses:
        '200':
          description: CSRF token
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/proxy/grant/{id}:
    get:
      tags:
        - Proxy & Playback
      summary: Stream media through secure tokenized proxy by grant ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full media stream response
        '206':
          description: Partial content / HTTP byte range stream
  /v1/proxy/token/{token}:
    get:
      tags:
        - Proxy & Playback
      summary: Stream media through stateless signed grant token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full media stream response
        '206':
          description: Partial content / HTTP byte range stream
  /health/live:
    get:
      tags:
        - Health & Metrics
      summary: Liveness probe for process uptime
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      tags:
        - Health & Metrics
      summary: Readiness probe for core subsystems
      responses:
        '200':
          description: Service is ready to handle traffic
        '503':
          description: Service is degraded or starting up
  /health/dependencies:
    get:
      tags:
        - Health & Metrics
      summary: Deep dependency health inspection
      responses:
        '200':
          description: All external dependencies operational
        '503':
          description: One or more dependencies are down
  /metrics:
    get:
      tags:
        - Health & Metrics
      summary: Prometheus metrics or JSON snapshot
      security:
        - BearerAuth: []
        - SessionAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum:
              - prometheus
              - json
      responses:
        '200':
          description: Prometheus text exposition or JSON metrics snapshot
  /manifest.json:
    get:
      tags:
        - Native Stremio
      summary: Native Stremio addon manifest
      responses:
        '200':
          description: Stremio manifest object
  /stream/{type}/{id}.json:
    get:
      tags:
        - Native Stremio
      summary: Native Stremio stream resolution endpoint
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - movie
              - series
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Stremio stream response ({ streams: [...] })'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or API Key
    SessionAuth:
      type: apiKey
      in: cookie
      name: cineflix_session
  schemas:
    OMSSMovieResponse:
      type: object
      required:
        - sources
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/OMSSSource'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/OMSSSubtitle'
        source:
          type: string
          example: stremio-addons
        addonsQueried:
          type: integer
          example: 3
        revision:
          type: integer
          example: 12
    OMSSTVResponse:
      type: object
      required:
        - sources
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/OMSSSource'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/OMSSSubtitle'
        source:
          type: string
          example: stremio-addons
        addonsQueried:
          type: integer
          example: 3
        revision:
          type: integer
          example: 12
    ProgressiveProviderResponse:
      type: object
      required:
        - sources
        - providerId
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/OMSSSource'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/OMSSSubtitle'
        diagnostics:
          type: array
          items:
            type: object
        providerId:

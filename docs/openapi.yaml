          type: boolean
    ImportStremioBody:
      type: object
      properties:
        authKey:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        enable:
          type: boolean
    ImportRepoBody:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        enable:
          type: boolean
    CreateJobBody:
      type: object
      required:
        - type
      properties:

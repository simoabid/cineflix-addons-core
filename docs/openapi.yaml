          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Invalid parameter
            details:
              type: array
              items:
                type: object
        requestId:
          type: string
          example: req-abc123
        revision:
          type: integer
          example: 5
  responses:
    BadRequest:
      description: Invalid input parameters or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication token missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource or media not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: Optimistic locking conflict (revision mismatch)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Too many requests, Retry-After header provided
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

        name:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        admissionState:
          type: string
          enum:
            - validated
            - disabled
            - quarantined
        capabilities:
          type: object
        health:
          type: object
        diagnostics:
          type: object
        revision:
          type: integer
    AddonListResponse:
      type: object
      required:
        - addons
        - pagination
        - revision
      properties:
        addons:
          type: array

            totalPages:
              type: integer
            hasMore:
              type: boolean
        store:
          type: string
        revision:
          type: integer
    InstallAddonBody:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        enable:
          type: boolean
          default: true
    PatchAddonBody:
      type: object
      properties:
        enabled:
          type: boolean
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 120000
    ReorderAddonsBody:
      type: object
      required:
        - order
      properties:

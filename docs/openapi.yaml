        name:
          type: string
        url:
          type: string
          format: uri
        quality:
          type: string
          example: 1080p
        type:
          type: string
          enum:
            - direct
            - hls
            - dash
            - torrent
        format:
          type: string
          enum:
            - mp4
            - mkv
            - hls
            - dash
        size:
          type: integer
        providerId:
          type: string
        addonName:
          type: string
        seeders:
          type: integer
    OMSSSubtitle:
      type: object
      required:
        - id
        - language
        - url
      properties:
        id:
          type: string
        language:
          type: string
          example: eng
        url:
          type: string
          format: uri
        format:
          type: string
          example: vtt
    SubtitlesResponse:
      type: object
      required:
        - subtitles
      properties:
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/OMSSSubtitle'
        revision:
          type: integer
    ProviderSummary:
      type: object
      required:
        - id
        - name
        - enabled
        - priority
        - revision
      properties:

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gate:
    name: Phase 0 quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run scan:secrets

      - name: Build and test (clean output — ADR 0005)
        run: npm run test:clean

      - name: Dead-code gate (files, dependencies, cycles)
        run: npm run check:deadcode

      - name: Coverage gate
        run: npm run check:coverage

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint


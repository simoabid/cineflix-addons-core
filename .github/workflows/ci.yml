name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gate:
    name: Phase 0 quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run scan:secrets

      - name: Build and test (clean output — ADR 0005)
        run: npm run test:clean

      - name: Dead-code gate (files, dependencies, cycles)
        run: npm run check:deadcode

      - name: Coverage gate
        run: npm run check:coverage

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint


  container:
    name: Phase 10 container gates
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate SBOM
        run: node scripts/sbom.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: addons-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (liveness under production defaults)
        run: |
          docker run -d --name smoke \
            -e TMDB_API_KEY=ci-smoke-key -e NODE_ENV=development \
            -p 3006:3006 addons-core:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3006/health/live > /dev/null; then
              echo "liveness OK"; exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/addons-core.cdx.json

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: addons-core:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
